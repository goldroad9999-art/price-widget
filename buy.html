<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>매입 시세</title>

  <style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Apple SD Gothic Neo,Noto Sans KR,sans-serif;
  background:#ffffff;
  color:#111827;
}

.wrap{
  max-width:980px;
  margin:auto;
  padding:34px 22px;
}

.header{
  padding:0;
  margin-bottom:22px;
  background:transparent;
  border:none;
  border-radius:0;
  box-shadow:none;
}

h1{
  font-size:34px;
  font-weight:900;
  margin:0 0 14px;
  letter-spacing:-0.06em;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  font-size:13px;
  color:#6b7280;
}

.meta div{
  background:#f8fafc;
  border:1px solid #eef0f3;
  border-radius:999px;
  padding:8px 12px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:28px 0 14px;
}

h2{
  font-size:18px;
  font-weight:900;
  margin:0;
  letter-spacing:-0.04em;
}

.badge{
  font-size:12px;
  color:#8a6d1d;
  background:#fff7d6;
  border:1px solid #f3df91;
  border-radius:999px;
  padding:7px 11px;
  font-weight:700;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}

.card{
  position:relative;
  overflow:hidden;
  background:#ffffff;
  border:1px solid #e5e7eb;
  border-radius:26px;
  padding:24px;
  min-height:210px;
  box-shadow:0 16px 38px rgba(15,23,42,.07);
  transition:transform .2s ease, box-shadow .2s ease;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 24px 52px rgba(15,23,42,.11);
}

.card::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  right:0;
  height:6px;
}

.card.gold::before{
  background:linear-gradient(90deg,#b8871f,#f6d365,#b8871f);
}

.card.k18::before{
  background:linear-gradient(90deg,#9c6b2f,#d9b46a,#9c6b2f);
}

.card.k14::before{
  background:linear-gradient(90deg,#c9a76a,#e8cf9b,#c9a76a);
}
  
.card-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.title{
  font-size:17px;
  font-weight:900;
  color:#111827;
  letter-spacing:-0.04em;
}

.sub{
  font-size:13px;
  color:#6b7280;
  margin-top:5px;
}

.mark{
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:900;
}

.gold .mark{
  color:#8a5a00;
  background:#fff4bf;
}

.k18 .mark{
  color:#7c4a12;
  background:#f7e6bd;
}

.k14 .mark{
  color:#475569;
  background:#f1f5f9;
}

.price{
  font-size:34px;
  font-weight:600;
  margin-top:28px;
  line-height:1.15;
  word-break:keep-all;
  letter-spacing:-0.04em;
  color:#0f172a;
}

.perg{
  display:inline-flex;
  gap:6px;
  align-items:center;
  margin-top:14px;
  font-size:14px;
  color:#111827;
  background:#f8fafc;
  border:1px solid #eef0f3;
  border-radius:999px;
  padding:8px 11px;
}

.perg span{
  color:#6b7280;
}

.note{
  margin-top:18px;
  font-size:13px;
  color:#6b7280;
  line-height:1.7;
  background:#ffffff;
  border:1px solid #e5e7eb;
  border-radius:20px;
  padding:16px 18px;
}

.loading{
  text-align:center;
  padding:40px;
  color:#6b7280;
  background:#ffffff;
  border:1px solid #e5e7eb;
  border-radius:20px;
}

/* compact 모드 */
body.compact .wrap{
  max-width:none;
  padding:10px;
}

body.compact .header{
  border-radius:16px;
  padding:14px;
  margin-bottom:10px;
}

body.compact h1{
  font-size:18px;
  margin-bottom:8px;
}

body.compact .meta{
  gap:5px;
  font-size:11px;
}

body.compact .meta div{
  padding:5px 7px;
}

body.compact .section-title{
  margin:14px 0 8px;
}

body.compact h2{
  font-size:15px;
}

body.compact .badge{
  font-size:10px;
  padding:5px 7px;
}

body.compact .cards{
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
}

body.compact .card{
  border-radius:14px;
  padding:12px 9px;
  min-height:auto;
  box-shadow:0 8px 18px rgba(15,23,42,.06);
}

body.compact .card:hover{
  transform:none;
}

body.compact .card::before{
  height:4px;
}

body.compact .title{
  font-size:13px;
}

body.compact .sub{
  font-size:11px;
}

body.compact .mark{
  display:none;
}

body.compact .price{
  font-size:17px;
  margin-top:12px;
}

body.compact .perg{
  margin-top:8px;
  font-size:10px;
  padding:5px 6px;
}

body.compact .note{
  margin-top:10px;
  font-size:11px;
  padding:10px;
  border-radius:14px;
}

@media (max-width:768px){
  .cards{
    grid-template-columns:1fr;
  }

  .card{
    min-height:auto;
  }
}

@media (max-width:480px){
  .wrap{
    padding:18px 12px;
  }

  .header{
    padding:22px;
    border-radius:22px;
  }

  h1{
    font-size:28px;
  }

  .price{
    font-size:34px;
  }

  body.compact .wrap{
    padding:8px;
  }

  body.compact .cards{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:6px;
  }

  body.compact .card{
    padding:10px 7px;
    border-radius:12px;
  }

  body.compact .title{
    font-size:14px;
  }

  body.compact .sub{
    font-size:10px;
  }

  body.compact .price{
    font-size:15px;
  }

  body.compact .perg{
    font-size:9px;
  }
}
</style>
</head>

<body>
<div class="wrap">

<div class="header">
  <h1>오늘의 매입 시세</h1>

  <div class="meta">
    <div id="fx">USD/KRW: -</div>
    <div id="update">업데이트: -</div>
  </div>
</div>

<div id="loading" class="loading">시세 불러오는 중...</div>

<div class="section-title">
  <h2>매입 시세</h2>
  <div class="badge">1돈 · 3.75g 기준</div>
</div>

<div class="cards" id="buyCards"></div>

<div class="note">
※ 표시된 매입가는 참고용 예상 단가입니다.<br>
※ 순금은 금덩어리 기준, 18K/14K는 제품 기준으로 산출됩니다.
</div>

</div>

<script>
const OZ_TO_G = 31.1034768;
const DON = 3.75;

const BUY_RATIO_GOLD_24K = 0.98;

const BUY_PURITY_24K = 1.0;
const BUY_PURITY_18K = 0.743;
const BUY_PURITY_14K = 0.574;

const fmt = n => new Intl.NumberFormat("ko-KR").format(Math.round(n)) + "원";
const fmtFx = n => new Intl.NumberFormat("ko-KR", { maximumFractionDigits: 2 }).format(n);

const params = new URLSearchParams(window.location.search);
const isCompact = params.get("mode") === "compact";

if (isCompact) {
  document.body.classList.add("compact");
}

let latestGoldPricePayload = null;

async function fetchFx(){
  const r = await fetch("https://open.er-api.com/v6/latest/USD");
  if (!r.ok) throw new Error("환율 데이터를 불러오지 못했습니다.");
  const j = await r.json();
  if (!j?.rates?.KRW) throw new Error("KRW 환율 데이터가 없습니다.");
  return j.rates.KRW;
}

async function fetchMetal(symbol){
  const r = await fetch(`/.netlify/functions/metal?symbol=${symbol}`);
  if (!r.ok) throw new Error("금속 시세 데이터를 불러오지 못했습니다.");
  const j = await r.json();
  if (!j?.close) throw new Error("금 시세 close 값이 없습니다.");
  return j;
}

function buyCardHtml(title, perDonPrice, type, mark){
  const perG = perDonPrice / DON;

  return `
  <div class="card ${type}">
    <div class="card-head">
      <div>
        <div class="title">${title}</div>
        <div class="sub">1돈(3.75g) 기준</div>
      </div>
      <div class="mark">${mark}</div>
    </div>
    <div class="price">${fmt(perDonPrice)}</div>
    <div class="perg"><span>1g 기준가</span> ${fmt(perG)}</div>
  </div>`;
}

function sendPriceMessage(payload){
  try{
    window.parent.postMessage(payload, "*");
  } catch (err){
    console.error("부모 페이지로 postMessage 전송 실패:", err);
  }
}

async function render(){
  try{
    const [fx, gold] = await Promise.all([
      fetchFx(),
      fetchMetal("xauusd")
    ]);

    document.getElementById("loading").style.display = "none";
    document.getElementById("date").textContent = "기준일: " + gold.date;
    document.getElementById("fx").textContent = "USD/KRW: " + fmtFx(fx);
    document.getElementById("update").textContent = "업데이트: " + new Date().toLocaleString("ko-KR");

    const goldRawPerDon = (gold.close * fx) / OZ_TO_G * DON;

    const goldBuyPerDon = goldRawPerDon * BUY_PURITY_24K * BUY_RATIO_GOLD_24K;
    const gold18kBuyPerDon = goldRawPerDon * BUY_PURITY_18K * BUY_RATIO_GOLD_24K;
    const gold14kBuyPerDon = goldRawPerDon * BUY_PURITY_14K * BUY_RATIO_GOLD_24K;

    const price24k = Math.round(goldBuyPerDon / DON);
    const price18k = Math.round(gold18kBuyPerDon / DON);
    const price14k = Math.round(gold14kBuyPerDon / DON);

    document.getElementById("buyCards").innerHTML =
      buyCardHtml("순금 매입시세", goldBuyPerDon, "gold", "24") +
      buyCardHtml("18K 매입시세", gold18kBuyPerDon, "k18", "18") +
      buyCardHtml("14K 매입시세", gold14kBuyPerDon, "k14", "14");

    latestGoldPricePayload = {
      type: "GOLD_PRICE_UPDATE",
      data: {
        "24k": price24k,
        "18k": price18k,
        "14k": price14k,
        date: gold.date,
        fx: fx,
        updatedAt: new Date().toLocaleString("ko-KR")
      }
    };

    sendPriceMessage(latestGoldPricePayload);

  } catch(e){
    document.getElementById("loading").textContent = "시세 불러오기 실패";
    console.error(e);

    sendPriceMessage({
      type: "GOLD_PRICE_ERROR",
      message: "시세 불러오기 실패"
    });
  }
}

window.addEventListener("message", function(event) {
  var payload = event.data;
  if (!payload || typeof payload !== "object") return;

  if (payload.type === "REQUEST_GOLD_PRICE" && latestGoldPricePayload) {
    sendPriceMessage(latestGoldPricePayload);
  }
});

render();
setInterval(render, 3600000);
</script>

</body>
</html>
